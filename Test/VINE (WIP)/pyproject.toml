[tool.poetry]
name = "BF-phylogenetics"
version = "0.1.0"
description = "VINE: Variational Inference with Node Embeddings for Bayesian Phylogenetic Inference"
authors = ["BF Phylogenetics Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
"jax[cuda12]" = "^0.4.23"
numpyro = "^0.13.0"
optax = "^0.2.1"
biopython = "^1.83"
dendropy = "^4.6.1"
matplotlib = "^3.8.0"
numpy = "^1.26.0"
scipy = "^1.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
black = "^24.0.0"
ruff = "^0.4.0"
ipython = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
