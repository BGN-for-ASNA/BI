name: doc-pages

# Execute the Python examples of every model page of the documentation
# (tests/test_model_pages.py). Too slow for every pull request: weekly, on
# pushes to dev that change a page or this test, and on demand.
on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  push:
    branches: [dev]
    paths:
      - "Documentation/*.qmd"
      - "tests/test_model_pages.py"
  workflow_dispatch:

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install BayesForge
        run: python -m pip install -e ".[cpu,pathfinder]" pytest
      - name: Run every model page
        run: |
          python -m pytest tests/test_model_pages.py -m pages -q -rA \
            | tee pages.log
          echo '## Model pages' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(PASSED|FAILED|SKIPPED|ERROR)" pages.log | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
