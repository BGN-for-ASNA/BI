name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install BayesForge
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[cpu]" pytest

      # Unit/regression tests plus every Python example of the "Get started"
      # documentation pages (tests/test_doc_examples.py).
      - name: Run tests
        run: python -m pytest tests -q
