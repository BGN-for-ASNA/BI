name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install BayesForge
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[cpu,pathfinder]" pytest

      # Unit/regression tests plus every Python example of the "Get started"
      # documentation pages (tests/test_doc_examples.py).
      # tests/conftest.py prints a table of the statistical checks, adds it
      # to the job summary and writes tests/_report/ (table + plots).
      - name: Run tests
        run: python -m pytest tests -q -m "not pages"

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report-py${{ matrix.python-version }}
          path: tests/_report/
          if-no-files-found: ignore

  # One compatibility matrix (compat.toml) for the Python, R and Julia packages:
  # this repository's pyproject.toml and the dev branches of BFR and
  # PyBayesForge.jl must agree with it.
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the compatibility matrix
        shell: bash          # with pipefail, so that | tee keeps the exit status
        run: python tools/check_compat.py | tee -a "$GITHUB_STEP_SUMMARY"
